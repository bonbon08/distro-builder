name: Check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Abhängigkeiten installieren
        run: pacman -Syu --noconfirm --needed archiso gtk4 libadwaita rust git base-devel
      - uses: actions/checkout@v4
      - name: Format prüfen
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked
      - name: Tests
        run: cargo test --workspace --locked
      - name: Profil-Erzeugung gegen echtes archiso-releng
        run: cargo test -p distro-builder-core --locked -- --include-ignored
