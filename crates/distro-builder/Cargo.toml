[package]
name = "distro-builder"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GTK4/libadwaita builder GUI for Distro Builder"

[[bin]]
name = "distro-builder"
path = "src/main.rs"

[dependencies]
distro-builder-core = { path = "../distro-builder-core" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
glib = "0.20"
gio = "0.20"
gdk = { package = "gdk4", version = "0.9", features = ["v4_12"] }
serde_json = "1"
regex = "1"
async-channel = "2"
